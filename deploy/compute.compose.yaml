# Last override. Existing paper ledger/executor remains the sole writer.
services:
  paper-worker:
    image: ai-trader-quant:hybrid-compute-second-20261126
    pull_policy: never
    environment:
      QUANT_COMPUTE_ENABLED: "true"
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      QUANT_LIVE_ENABLED: "false"
  api:
    image: ai-trader-quant:hybrid-compute-api-20261126
    pull_policy: never
  compute-bridge:
    image: ai-trader-quant:hybrid-compute-second-20261126
    pull_policy: never
    env_file: compute.env
    environment:
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      DEEPSEEK_API_KEY: ""
      AI4TRADE_TOKEN: ""
      QUANT_ENABLED: "false"
      QUANT_LIVE_ENABLED: "false"
      QUANT_COMPUTE_TOKEN_FILE: /run/secrets/compute-token
      QUANT_COMPUTE_SHADOW: "false"
    command: [python, -m, quant.compute_service]
    ports:
      - "127.0.0.1:18765:8765"
    volumes:
      - ./data:/data:ro
      - ./compute-token:/run/secrets/compute-token:ro
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
