services:
  quant:
    image: ai-trader-quant:rest-guard-20261113
    environment:
      QUANT_REST_GUARD_REDIS_URL: redis://redis:6379/1
      QUANT_ENABLED: "false"
      QUANT_LIVE_ENABLED: "false"
      QUANT_OBSERVATION_ONLY: "true"
  api:
    image: ai-trader-quant:quant-forward-trial-20261118
    environment:
      QUANT_REST_GUARD_REDIS_URL: redis://redis:6379/1
      QUANT_PAPER_AI_AUTOPILOT: "false"
      QUANT_PAPER_FAST_EXECUTION: "false"
      QUANT_PAPER_DS_AUTHORITY: "false"
      QUANT_PAPER_SYSTEMATIC: "true"
      QUANT_PAPER_SYSTEMATIC_EXPLORATION: "true"
      QUANT_PAPER_EXPLORATION_MODE: "false"
      QUANT_PAPER_REFLECTION_ENABLED: "false"
      DEEPSEEK_API_KEY: ""
      QUANT_PAPER_COMPOUND_CAPITAL_USDT: "6000"
      QUANT_PAPER_COMPOUND_RISK_FRACTION: "0.001"
  paper-worker:
    image: ai-trader-quant:quant-forward-trial-20261118
    environment:
      QUANT_REST_GUARD_REDIS_URL: redis://redis:6379/1
      QUANT_PAPER_AI_AUTOPILOT: "false"
      QUANT_PAPER_FAST_EXECUTION: "false"
      QUANT_PAPER_DS_AUTHORITY: "false"
      QUANT_PAPER_SYSTEMATIC: "true"
      QUANT_PAPER_SYSTEMATIC_EXPLORATION: "true"
      QUANT_PAPER_EXPLORATION_MODE: "false"
      QUANT_PAPER_REFLECTION_ENABLED: "false"
      DEEPSEEK_API_KEY: ""
      QUANT_PAPER_COMPOUND_CAPITAL_USDT: "6000"
      QUANT_PAPER_COMPOUND_RISK_FRACTION: "0.001"
  lab-collector:
    image: ai-trader-quant:rest-guard-20261113
    environment:
      QUANT_REST_GUARD_REDIS_URL: redis://redis:6379/1
  potential-radar:
    image: ai-trader-quant:rest-guard-20261113
    pull_policy: never
    env_file: .env
    environment:
      QUANT_REST_GUARD_REDIS_URL: redis://redis:6379/1
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      DEEPSEEK_API_KEY: ""
      AI4TRADE_TOKEN: ""
      QUANT_ENABLED: "false"
      QUANT_LIVE_ENABLED: "false"
      QUANT_AI_ENABLED: "false"
      QUANT_OBSERVATION_ONLY: "true"
      QUANT_RADAR_ENABLED: "true"
      QUANT_RADAR_AUTO_TRAIN: "true"
      QUANT_REDIS_URL: redis://redis:6379/1
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    command: [python, -m, quant.potential_worker]
    restart: unless-stopped
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 220m
    cpus: 0.25
  radar-ai:
    image: ai-trader-quant:dual-horizon-ai-20261113-v2
    pull_policy: never
    environment:
      DEEPSEEK_API_KEY: ""
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      QUANT_LAB_DIR: ${QUANT_LAB_DIR:-/data/lab}
      QUANT_RADAR_AI_ENABLED: "false"
      QUANT_ENABLED: "false"
      QUANT_LIVE_ENABLED: "false"
      QUANT_AI_ENABLED: "false"
      QUANT_PAPER_AI_AUTOPILOT: "false"
      QUANT_OBSERVATION_ONLY: "true"
    command: [python, -m, quant.potential_ai]
    restart: unless-stopped
    volumes:
      - ./data:/data
    mem_limit: 96m
    cpus: 0.15
  quant-research:
    image: ai-trader-quant:quant-forward-trial-20261118
    pull_policy: never
    env_file: .env
    environment:
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      DEEPSEEK_API_KEY: ""
      AI4TRADE_TOKEN: ""
      QUANT_MODE: paper
      QUANT_ENABLED: "false"
      QUANT_LIVE_ENABLED: "false"
      QUANT_OBSERVATION_ONLY: "true"
      QUANT_REDIS_URL: redis://redis:6379/1
      QUANT_SYSTEM_RESEARCH_INTERVAL_SECONDS: "86400"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    command: [python, -m, quant.quant_research, --watch, --window-hours, "168"]
    restart: unless-stopped
    volumes:
      - ./data:/data
    depends_on:
      lab-collector:
        condition: service_started
    mem_limit: 768m
    cpus: 0.5
