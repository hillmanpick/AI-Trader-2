services:
  api:
    image: ai-trader-quant:potential-radar-20261113-v1
  potential-radar:
    image: ai-trader-quant:potential-radar-20261113-v1
    pull_policy: never
    env_file: .env
    environment:
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      DEEPSEEK_API_KEY: ""
      AI4TRADE_TOKEN: ""
      QUANT_ENABLED: "false"
      QUANT_LIVE_ENABLED: "false"
      QUANT_AI_ENABLED: "false"
      QUANT_OBSERVATION_ONLY: "true"
      QUANT_RADAR_ENABLED: "true"
      QUANT_RADAR_AUTO_TRAIN: "true"
      QUANT_REDIS_URL: redis://redis:6379/1
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    command: [python, -m, quant.potential_worker]
    restart: unless-stopped
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 220m
    cpus: 0.25
